[project]
name = "aura-ai"
version = "0.1.0"
description = "An intelligent, context-aware AI companion built with FastAPI, LangGraph, and FastMCP"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "mmkyadav" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.2.0",
    "fastmcp>=3.4.0",
    "mcp>=1.20.0",
    "litellm>=1.35.0",
    "psycopg[binary,pool]>=3.1.18",
    "pgvector>=0.2.5",
    "python-dotenv>=1.0.1",
    "colorama>=0.4.6",
    "sympy>=1.12",
    "tiktoken>=0.6.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aura*", "aura_mcp*"]
exclude = ["frontend*", "sessions*", "tests*"]

